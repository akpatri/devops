# ================================================================
# VERSION EXAMPLES
# ================================================================

# version: "1.2.3"  # Standard SemVer chart version
# version: "1.2.3-alpha.1"  # SemVer pre-release version
# version: "1.2.3-alpha.1+ef365"  # SemVer version with build metadata
# version: "1.2"  # Helm can attempt to coerce this into 1.2.0
# version: "v1.2"  # Helm can attempt to coerce this into a valid SemVer
#
# nginx-1.2.3.tgz  # Example package name generated from chart name + chart version


# ================================================================
# KUBERNETES VERSION CONSTRAINT EXAMPLES
# ================================================================

# kubeVersion: ">=1.13.0 <1.15.0"  # AND: Kubernetes must satisfy both constraints

# kubeVersion: ">=1.13.0 <1.14.0 || >=1.14.1 <1.15.0"  # OR: either range is accepted; 1.14.0 is excluded

# kubeVersion: "1.1 - 2.3.4"  # Hyphen range: equivalent to >=1.1 and <=2.3.4

# kubeVersion: "1.2.x"  # Wildcard range: equivalent to >=1.2.0 and <1.3.0

# kubeVersion: "~1.2.3"  # Tilde range: patch-level changes are allowed below 1.3.0

# kubeVersion: "^1.2.3"  # Caret range: compatible minor versions are allowed below 2.0.0

# kubeVersion: ">=1.2.0"  # Comparison operator: Kubernetes 1.2.0 or newer


# ================================================================
# APPVERSION vs VERSION
# ================================================================

# version: "1.2.3"  # Version of the Helm chart itself
# appVersion: "8.2.1"  # Version of the application packaged by the chart
#
# version changes when the CHART changes.  # Chart release concept
# appVersion describes which APPLICATION version the chart contains.  # Application version concept
# appVersion is informational and does not affect chart version calculations.  # appVersion behavior
# Quotes around appVersion are recommended because YAML may otherwise interpret some values unexpectedly.  # YAML parsing


# ================================================================
# CHART TYPES
# ================================================================

# type: application  # Default type; normal installable chart containing Kubernetes resources

# type: library  # Reusable chart containing utilities/functions for other charts; not installed as a standalone application


# ================================================================
# DEPRECATION
# ================================================================

# deprecated: true  # Marks this chart version as deprecated
#
# Typical repository workflow:  # Deprecation workflow
# 1. Mark the chart as deprecated and bump the version.  # First step
# 2. Release the new chart version to the chart repository.  # Second step
# 3. Remove the chart from the source repository.  # Third step
#
# If the latest repository version is deprecated, the chart as a whole is considered deprecated.  # Repository behavior
# A later non-deprecated version can reuse the chart name.  # Name reuse


# ================================================================
# IMPORTANT HELM 3.3.2+ RULE
# ================================================================

# foo: "bar"  # DO NOT add arbitrary unsupported top-level fields to Chart.yaml
# annotations:  # USE annotations for custom metadata
#   foo: "bar"  # Custom metadata belongs here