# Chart.yaml is the required metadata file for a Helm chart.  # Chart metadata
# REQUIRED fields: apiVersion, name, and version.  # Required fields
# OPTIONAL fields: kubeVersion, description, type, keywords, home, sources, dependencies, maintainers, icon, appVersion, deprecated, and annotations.  # Optional fields
# version identifies the Helm chart; appVersion identifies the application inside the chart.  # Important distinction
# Chart version follows SemVer conventions and is used in the packaged chart name.  # Versioning
# Example: name "nginx" + version "1.2.3" becomes nginx-1.2.3.tgz.  # Package naming
# apiVersion v2 is for charts requiring Helm 3 or later; v1 is the older chart format.  # Chart API
# In v2, dependencies are defined here instead of the old requirements.yaml file.  # Dependency change
# The type field distinguishes application and library charts.  # Chart type
# Custom metadata should be placed inside annotations.  # Custom metadata
# The Helm documentation page currently notes that its content has not yet been updated for Helm 4.  # Documentation note

apiVersion: v2  # REQUIRED: Chart API version; v2 is used for Helm 3+ charts

name: learning-web  # REQUIRED: Name used in labels and as the default part of resource names

version: "1.2.3"  # REQUIRED: Version of the Helm chart; used as the chart release marker


kubeVersion: ">=1.25.0-0"  # OPTIONAL: This demo uses stable APIs available in modern Kubernetes

description: "A commented learning chart demonstrating Helm templates and a local subchart"  # OPTIONAL: Single-sentence description of the project

type: application  # OPTIONAL: Chart type; application is the default and is the normal installable chart


keywords:  # OPTIONAL: List of keywords describing the project
  - nginx  # Keyword describing the application
  - web-server  # Keyword describing the application's purpose
  - http  # Keyword describing the application's technology


home: "https://helm.sh/"  # OPTIONAL: URL of the project's home page

sources:  # OPTIONAL: List of URLs containing the project's source code
  - "https://github.com/example/nginx"  # Source-code repository
  - "https://gitlab.com/example/nginx"  # Another possible source-code location


dependencies:  # OPTIONAL: Dependencies are rendered as part of the parent release
  - name: demo-subchart  # Must match charts/demo-subchart/Chart.yaml
    version: "0.1.0"  # Must satisfy the child chart's version
    alias: demoSubchart  # Values for this child live under .Values.demoSubchart
    condition: demoSubchart.enabled  # Set this value to false to skip rendering the child
    tags:  # A tag can switch a group of dependencies together
      - learning-examples  # Disable with --set tags.learning-examples=false
    import-values:  # Copy the child's exported data into the parent's values tree
      - child: data  # Read the child chart's exports.data section
        parent: importedDemo  # Parent templates can read .Values.importedDemo.greeting
    # repository is omitted because this child chart is already under charts/.


maintainers:  # OPTIONAL: List of people maintaining the chart

  - name: "Jane Doe"  # REQUIRED for each maintainer: Maintainer's name
    email: "jane@example.com"  # OPTIONAL for each maintainer: Maintainer's email address
    url: "https://example.com/jane"  # OPTIONAL for each maintainer: URL for the maintainer


icon: "https://example.com/nginx.png"  # OPTIONAL: URL to an SVG or PNG image used as the chart icon

appVersion: "1.27.5"  # OPTIONAL: Version of the NGINX application contained in the chart

deprecated: false  # OPTIONAL: Boolean indicating whether the chart is deprecated

annotations:  # OPTIONAL: Custom metadata stored as key/value pairs
  example: "custom metadata"  # Example custom annotation
  team: "platform"  # Example annotation identifying the responsible team
  purpose: "web-server"  # Example annotation describing the chart's purpose


