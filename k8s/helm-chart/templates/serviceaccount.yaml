{{- if .Values.serviceAccount.create }}{{/* Create the account only when configured to do so. */}}
apiVersion: v1 # ServiceAccounts use the core Kubernetes API.
kind: ServiceAccount # Declare the identity used by the application Pod.
metadata: # Resource name, labels, and annotations are declared below.
  name: {{ include "learning-web.serviceAccountName" . }} # Use the configured or generated account name.
  labels: # Standard labels identify this ServiceAccount.
    {{- include "learning-web.labels" . | nindent 4 }}{{/* Attach the standard chart labels. */}}
  {{- with .Values.serviceAccount.annotations }}{{/* Omit annotations when the map is empty. */}}
  annotations: # Optional annotations let integrations discover extra metadata.
    {{- toYaml . | nindent 4 }}{{/* Convert the user-provided map to YAML. */}}
  {{- end }}{{/* End the optional annotations block. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }} # Avoid mounting API credentials when disabled.
{{- end }}{{/* End the optional ServiceAccount resource. */}}
