apiVersion: v1 # Secrets use the core Kubernetes API.
kind: Secret # Demonstrate a resource for sensitive values; these sample values are fake.
metadata: # Resource name and labels are declared below.
  name: {{ include "learning-web.fullname" . }}-credentials # Give this release its own credentials object.
  labels: # Standard labels identify this release's Secret.
    {{- include "learning-web.labels" . | nindent 4 }}{{/* Attach standard chart labels. */}}
type: Opaque # Store arbitrary string key/value data.
# stringData is convenient for a tutorial, but Helm stores these values in release history.
# Never put real credentials in values.yaml or commit them to source control.
stringData: # Kubernetes encodes these plain-text input values when storing the Secret.
  {{- toYaml .Values.secrets | nindent 2 }}{{/* Kubernetes converts stringData to encoded Secret data. */}}
